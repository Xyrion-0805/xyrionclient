name: Windows package (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare GNU toolchain and build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'xyrion-tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'w64devkit.exe'
          Invoke-WebRequest 'https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '18D0A4C71A166F8401AB6305781BEC5882B40B5E06BA9807C61CB5F3B3C6325E') {
            throw 'w64devkit archive SHA256 mismatch'
          }
          & $archive -y "-o$tools"
          if ($LASTEXITCODE -ne 0) { throw 'Toolchain extraction failed' }
          python -m pip install --target "$tools/python-packages" cmake==3.31.6 ninja==1.11.1.3
          if ($LASTEXITCODE -ne 0) { throw 'Build tool installation failed' }
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
      - name: Compile and package
        env:
          RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-gnu
        run: |
          & ./scripts/build_xyrion.ps1 -Action Package -Jobs 4 -ToolsDirectory (Join-Path $env:RUNNER_TEMP 'xyrion-tools')
      - name: Upload complete runtime folder
        uses: actions/upload-artifact@v4
        with:
          name: XyrionClient-1.2.0-win64
          path: dist/XyrionClient/
          if-no-files-found: error
          retention-days: 14
